syntax = "proto3";
package laurus.v1;

// A polymorphic value that can represent any supported data type.
message Value {
  oneof kind {
    bool null_value = 1;
    bool bool_value = 2;
    int64 int64_value = 3;
    double float64_value = 4;
    string text_value = 5;
    bytes bytes_value = 6;
    VectorValue vector_value = 7;
    int64 datetime_value = 8;  // Unix microseconds (UTC)
    GeoPoint geo_value = 9;
    Int64ArrayValue int64_array_value = 10;
    Float64ArrayValue float64_array_value = 11;
  }
}

// A vector of floating-point values.
message VectorValue {
  repeated float values = 1;
}

// A multi-valued 64-bit signed integer field (Lucene-style "any match" semantics).
message Int64ArrayValue {
  repeated int64 values = 1;
}

// A multi-valued 64-bit floating-point field (Lucene-style "any match" semantics).
message Float64ArrayValue {
  repeated double values = 1;
}

// A geographic point (latitude/longitude).
message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

// A document consisting of named fields.
message Document {
  map<string, Value> fields = 1;
}
