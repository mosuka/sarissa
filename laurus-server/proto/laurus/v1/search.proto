syntax = "proto3";
package laurus.v1;

import "laurus/v1/common.proto";

// Service for hybrid search (lexical + vector).
service SearchService {
  // Execute a search and return all results at once.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Execute a search and stream results one by one.
  rpc SearchStream(SearchRequest) returns (stream SearchResult);

  // Execute multiple independent searches in a single round trip.
  //
  // Each `SearchRequest` in `queries` is dispatched in parallel on the
  // server (the engine uses `futures::future::try_join_all` under the
  // hood). Returns one `SearchResponse` per input query, in the same
  // order. Empty input returns an empty `results` list.
  //
  // Issue #714 Phase 3a of #648.
  rpc SearchBatch(SearchBatchRequest) returns (SearchBatchResponse);
}

message SearchBatchRequest {
  // List of independent search requests to execute in parallel.
  repeated SearchRequest queries = 1;
}

message SearchBatchResponse {
  // One response per input query, in input order.
  repeated SearchResponse results = 1;
}

message SearchRequest {
  // Lexical query in Laurus DSL syntax.
  string query = 1;

  // Vector queries (pre-embedded).
  repeated QueryVector query_vectors = 2;

  // Maximum number of results to return.
  uint32 limit = 3;

  // Number of results to skip.
  uint32 offset = 4;

  // Fusion algorithm for combining lexical and vector scores.
  optional FusionAlgorithm fusion = 5;

  // Lexical search parameters.
  optional LexicalParams lexical_params = 6;

  // Vector search parameters.
  optional VectorParams vector_params = 7;

  // Per-field boost factors for lexical scoring.
  map<string, float> field_boosts = 8;
}

message QueryVector {
  repeated float vector = 1;
  float weight = 2;
  repeated string fields = 3;
}

message FusionAlgorithm {
  oneof algorithm {
    RRF rrf = 1;
    WeightedSum weighted_sum = 2;
  }
}

message RRF {
  double k = 1;
}

message WeightedSum {
  float lexical_weight = 1;
  float vector_weight = 2;
}

message LexicalParams {
  float min_score = 1;
  optional uint64 timeout_ms = 2;
  bool parallel = 3;
  optional SortSpec sort_by = 4;
}

message SortSpec {
  // Field name to sort by. Empty string means sort by score.
  string field = 1;
  SortOrder order = 2;
}

enum SortOrder {
  SORT_ORDER_ASC = 0;
  SORT_ORDER_DESC = 1;
}

message VectorParams {
  repeated string fields = 1;
  VectorScoreMode score_mode = 2;
  float overfetch = 3;
  float min_score = 4;

  // Two-stage rerank multiplier (Issue #481 Stage 2).
  //
  // When set, the searcher fetches `top_k * rerank_factor` candidates
  // via the int8 quantized hot path and then re-scores them with the
  // full f32 vectors before returning the final top_k.
  //
  // STAGE 2 STATUS: not yet implemented in laurus core. Requesting a
  // value here today returns LaurusError::NotImplemented. The field
  // is reserved at proto tag 5 so older / newer clients can negotiate
  // the upgrade without another schema bump.
  optional uint32 rerank_factor = 5;

  // Per-query override for the HNSW `ef_search` candidate-list size
  // (Issue #644). When unset, the searcher uses the schema-level
  // `HnswOption.default_ef_search` or an internal fallback (`50`).
  // The effective ef is always lifted to `max(top_k, top_k * rerank_factor)`
  // so the candidate heap is never undersized for the requested
  // `top_k`.
  optional uint32 ef_search = 6;
}

enum VectorScoreMode {
  VECTOR_SCORE_MODE_WEIGHTED_SUM = 0;
  VECTOR_SCORE_MODE_MAX_SIM = 1;
  VECTOR_SCORE_MODE_LATE_INTERACTION = 2;
}

message SearchResponse {
  repeated SearchResult results = 1;
  // Total number of matching results (before limit/offset).
  uint64 total_hits = 2;
}

message SearchResult {
  string id = 1;
  float score = 2;
  Document document = 3;
}
