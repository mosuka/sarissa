# Configuration for wasm32-unknown-unknown target.
# getrandom 0.3.x requires this cfg flag for WASM support.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = "qemu-aarch64-static -L /usr/aarch64-linux-gnu"

# Environment variables exported to cargo, build scripts, and rustc.
#
# Cargo [env] passes these into every subprocess it spawns, including
# build scripts that run from ~/.cargo/registry/... where the project's
# .python-version / .ruby-version files are NOT visible to pyenv / rbenv
# shims. That is why pinning here is needed.
#
# `force = false` (the default) means a value supplied by the caller's
# shell still wins — so CI can override e.g. RBENV_VERSION=3.3.0.
#
# IMPORTANT: keep these in sync with .python-version and .ruby-version.
# (cargo [env] cannot read external files, so this is a manual mirror.)
[env]
PYENV_VERSION = "3.13.5"
RBENV_VERSION = "4.0.2"
